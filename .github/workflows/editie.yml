name: Editie maken

on:
  schedule:
    # De echte wekker staat op cron-job.org: om 07:55 en 19:55, zodat de editie om 08:00 en 20:00
    # klaarstaat, en om 08:35 en 20:35 als reserve. Dit hier is een extra reserve: GitHub plant in
    # UTC, kent geen zomertijd, en start geplande runs soms uren te laat of helemaal niet. Elke run
    # kijkt eerst of de laatste editie ontbreekt; zo niet, dan stopt hij na een paar seconden.
    - cron: "7,37 6-10,18-22 * * *"
  workflow_dispatch:
    inputs:
      nu_maken:
        description: "Nu een editie maken, ook buiten 08:00 en 20:00"
        type: boolean
        default: false
      claude_testen:
        description: "Alleen testen of de Claude-sleutel werkt"
        type: boolean
        default: false
      proef:
        description: "Proefeditie maken met al het nieuws van 2 dagen: alles testen, niets bewaren, publiceren of mailen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: editie
  cancel-in-progress: false

jobs:
  editie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publiceer.outputs.page_url }}
    env:
      TZ: Europe/Amsterdam
      # De keuzes uit de knop "Run workflow", als omgevingsvariabelen in plaats van rechtstreeks in de opdrachten.
      NU_MAKEN: ${{ inputs.nu_maken }}
      CLAUDE_TESTEN: ${{ inputs.claude_testen }}
      PROEF: ${{ inputs.proef }}
    steps:
      # Vaste versies (commit-codes) van de onderdelen van GitHub, zodat een latere wijziging daarin niet ongemerkt meedoet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # De nieuwste versie, niet die van het moment van het startsignaal. Komen er twee signalen vlak na
          # elkaar, dan wacht de tweede run tot de eerste klaar is (concurrency hieronder) en ziet hij hier
          # dat de editie er al is. Anders maakte hij een tweede editie en ging er een tweede mail uit.
          ref: main
          # De schrijfrechten blijven niet in de map staan; alleen de stap "Editie bewaren" krijgt ze.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Is er een editie nodig?
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "nodig=true" >> "$GITHUB_OUTPUT"
          else
            python ai_nieuws.py --nodig
          fi

      - name: Claude Code en Pillow installeren
        if: steps.check.outputs.nodig == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Pillow meet de beelden, zodat logo's en te kleine plaatjes wegvallen.
          pip install --quiet pillow

      - name: Claude-sleutel testen
        if: steps.check.outputs.nodig == 'true' && env.CLAUDE_TESTEN == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Antwoord alleen met het woord: werkt" | claude -p --safe-mode --tools "" --model haiku

      - name: Editie maken
        if: steps.check.outputs.nodig == 'true' && env.CLAUDE_TESTEN != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
          MAIL_ADRES: ${{ secrets.MAIL_ADRES }}
        run: |
          if [ "$PROEF" = "true" ]; then
            python ai_nieuws.py --voorbeeld --alles
          elif [ "$NU_MAKEN" = "true" ]; then
            python ai_nieuws.py
          else
            python ai_nieuws.py --gepland
          fi

      # Ook als het mailen mislukte: de editie zelf moet bewaard blijven.
      - name: Editie bewaren
        if: always() && steps.check.outputs.nodig == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AI-nieuws"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edities begrippen.json gezien.json
          if [ -d weken ]; then git add weken; fi
          if ! git diff --cached --quiet; then
            git commit -m "Editie $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        if: always() && steps.check.outputs.nodig == 'true' && hashFiles('site/index.html') != ''

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        if: always() && steps.check.outputs.nodig == 'true' && hashFiles('site/index.html') != ''
        with:
          path: site

      - id: publiceer
        if: always() && steps.check.outputs.nodig == 'true' && hashFiles('site/index.html') != ''
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

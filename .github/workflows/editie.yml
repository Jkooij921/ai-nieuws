name: Editie maken

on:
  schedule:
    # GitHub plant in UTC, kent geen zomertijd, en start geplande runs soms uren te laat of
    # helemaal niet, vooral op het hele uur. Daarom twee keer per uur, op rustige minuten, in
    # de uren na 08:00 en 20:00 Nederlandse tijd. Elke run kijkt eerst of de laatste editie
    # ontbreekt; zo niet, dan stopt hij na een paar seconden.
    - cron: "7,37 6-10,18-22 * * *"
  workflow_dispatch:
    inputs:
      nu_maken:
        description: "Nu een editie maken, ook buiten 08:00 en 20:00"
        type: boolean
        default: false
      claude_testen:
        description: "Alleen testen of de Claude-sleutel werkt"
        type: boolean
        default: false
      proef:
        description: "Proefeditie maken met al het nieuws van 2 dagen: alles testen, niets bewaren, publiceren of mailen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: editie
  cancel-in-progress: false

jobs:
  editie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publiceer.outputs.page_url }}
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Is er een editie nodig?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "nodig=true" >> "$GITHUB_OUTPUT"
          else
            python ai_nieuws.py --nodig
          fi

      - name: Claude Code en Pillow installeren
        if: steps.check.outputs.nodig == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Pillow meet de beelden, zodat logo's en te kleine plaatjes wegvallen.
          pip install --quiet pillow

      - name: Claude-sleutel testen
        if: steps.check.outputs.nodig == 'true' && inputs.claude_testen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Antwoord alleen met het woord: werkt" | claude -p --safe-mode --tools "" --model haiku

      - name: Editie maken
        if: steps.check.outputs.nodig == 'true' && !inputs.claude_testen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
          MAIL_ADRES: ${{ secrets.MAIL_ADRES }}
        run: |
          if [ "${{ inputs.proef }}" = "true" ]; then
            python ai_nieuws.py --voorbeeld --alles
          elif [ "${{ inputs.nu_maken }}" = "true" ]; then
            python ai_nieuws.py
          else
            python ai_nieuws.py --gepland
          fi

      # Ook als het mailen mislukte: de editie zelf moet bewaard blijven.
      - name: Editie bewaren
        if: always() && steps.check.outputs.nodig == 'true'
        run: |
          git config user.name "AI-nieuws"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edities begrippen.json gezien.json
          if [ -d weken ]; then git add weken; fi
          if ! git diff --cached --quiet; then
            git commit -m "Editie $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6
        if: always() && steps.check.outputs.nodig == 'true' && hashFiles('site/index.html') != ''

      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.check.outputs.nodig == 'true' && hashFiles('site/index.html') != ''
        with:
          path: site

      - id: publiceer
        if: always() && steps.check.outputs.nodig == 'true' && hashFiles('site/index.html') != ''
        uses: actions/deploy-pages@v5
